<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Man 3D — Computação Gráfica</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- three.js carregado via CDN (sem etapa de build) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Painel de demonstração: câmera ativa e teclas -->
  <aside id="hud">
    <div class="hud-row">
      <span class="hud-label">Câmera</span>
      <span id="hud-camera"></span>
    </div>
    <p class="hud-keys"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> ou <kbd>C</kbd> trocar câmera</p>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
